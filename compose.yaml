name: rtk-smart-warehouse


x-logging: &default-logging
  driver: json-file

  options:
    max-size: "10m"
    max-file: "5"


x-backend-common: &backend-common
  image: ${BACKEND_IMAGE:?BACKEND_IMAGE is required}

  restart: unless-stopped

  init: true

  env_file:
    - ${ENV_FILE:-.env.dev}

  security_opt:
    - no-new-privileges:true

  logging: *default-logging


services:
  db:
    image: postgres:16-alpine

    restart: unless-stopped

    environment:
      POSTGRES_DB: ${POSTGRES_DB:?POSTGRES_DB is required}
      POSTGRES_USER: ${POSTGRES_USER:?POSTGRES_USER is required}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}

    volumes:
      - postgres_data:/var/lib/postgresql/data

    healthcheck:
      test:
        [
          "CMD-SHELL",
          "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"
        ]

      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

    security_opt:
      - no-new-privileges:true

    logging: *default-logging

    networks:
      - data

  redis:
    image: redis:7-alpine

    restart: unless-stopped

    command:
      - redis-server
      - --appendonly
      - "yes"
      - --appendfsync
      - everysec

    volumes:
      - redis_data:/data

    healthcheck:
      test:
        - CMD
        - redis-cli
        - ping

      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 5s

    security_opt:
      - no-new-privileges:true

    logging: *default-logging

    networks:
      - data

  api:
    <<: *backend-common

    depends_on:
      db:
        condition: service_healthy

      redis:
        condition: service_healthy

      keycloak:
        condition: service_started

    expose:
      - "8000"

    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import socket; s=socket.create_connection(('127.0.0.1', 8000), 2); s.close()"
        ]

      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 20s

    networks:
      - app
      - data

  worker:
    <<: *backend-common

    command:
      - python
      - -m
      - backend.workers.runner

    depends_on:
      db:
        condition: service_healthy

      redis:
        condition: service_healthy

    stop_grace_period: 30s

    networks:
      - data
      - egress

  scheduler:
    <<: *backend-common

    command:
      - python
      - -m
      - backend.scheduler.main

    depends_on:
      db:
        condition: service_healthy

      redis:
        condition: service_healthy

    stop_grace_period: 30s

    networks:
      - data
      - egress

  keycloak-db:
    image: postgres:16-alpine

    restart: unless-stopped

    environment:
      POSTGRES_DB: ${KEYCLOAK_POSTGRES_DB:?KEYCLOAK_POSTGRES_DB is required}
      POSTGRES_USER: ${KEYCLOAK_POSTGRES_USER:?KEYCLOAK_POSTGRES_USER is required}
      POSTGRES_PASSWORD: ${KEYCLOAK_POSTGRES_PASSWORD:?KEYCLOAK_POSTGRES_PASSWORD is required}

    volumes:
      - keycloak_postgres_data:/var/lib/postgresql/data

    healthcheck:
      test:
        [
          "CMD-SHELL",
          "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"
        ]

      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

    security_opt:
      - no-new-privileges:true

    logging: *default-logging

    networks:
      - auth

  keycloak:
    image: quay.io/keycloak/keycloak:26.4.0

    restart: unless-stopped

    init: true

    env_file:
      - ${ENV_FILE:-.env.dev}

    depends_on:
      keycloak-db:
        condition: service_healthy

    expose:
      - "8080"

    security_opt:
      - no-new-privileges:true

    logging: *default-logging

    networks:
      - app
      - auth


volumes:
  postgres_data:
  redis_data:
  keycloak_postgres_data:
  caddy_data:
  caddy_config:


networks:
  # Caddy / frontend / API / Keycloak
  app:
    driver: bridge

  # Backend <-> PostgreSQL / Redis
  data:
    driver: bridge
    internal: true

  # Keycloak <-> Keycloak PostgreSQL
  auth:
    driver: bridge
    internal: true

  # Доступ worker/scheduler во внешний интернет при необходимости.
  egress:
    driver: bridge