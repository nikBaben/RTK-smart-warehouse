name: rtk-smart-warehouse-prod

x-prod-backend: &prod-backend
  image: ${BACKEND_IMAGE:?Set BACKEND_IMAGE to a versioned production image}
  build:
    context: .
    target: production
  env_file: [.env.prod]

services:
  api:
    <<: *prod-backend
    command: [uvicorn, backend.main:app, --host, 0.0.0.0, --port, "8000", --proxy-headers, "--forwarded-allow-ips=*", --workers, "${UVICORN_WORKERS:-2}"]
    stop_grace_period: 30s
  worker:
    <<: *prod-backend
  scheduler:
    <<: *prod-backend
  keycloak:
    command: [start]
    environment:
      KC_PROXY_HEADERS: xforwarded
      KC_HOSTNAME: https://${KEYCLOAK_DOMAIN:?Set KEYCLOAK_DOMAIN}
      KC_HOSTNAME_STRICT: "true"
  frontend:
    image: ${FRONTEND_IMAGE:?Set FRONTEND_IMAGE to a versioned production image}
    build:
      context: ./frontend
      target: production
    restart: unless-stopped
    init: true
    expose: ["80"]
    security_opt: [no-new-privileges:true]
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "5"
    networks: [app]
  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    init: true
    ports: ["80:80", "443:443"]
    environment:
      APP_DOMAIN: ${APP_DOMAIN:?Set APP_DOMAIN}
      KEYCLOAK_DOMAIN: ${KEYCLOAK_DOMAIN:?Set KEYCLOAK_DOMAIN}
    volumes:
      - ./docker/caddy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      api:
        condition: service_healthy
      frontend:
        condition: service_started
      keycloak:
        condition: service_healthy
    security_opt: [no-new-privileges:true]
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "5"
    networks: [app]

volumes:
  caddy_data:
  caddy_config:
